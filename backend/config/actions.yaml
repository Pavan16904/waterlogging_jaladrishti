# ==============================================================================
# JalaDrishti AI - Fixed Civil & Agricultural Drainage Action Library
# Standard operating procedures mapped to hydrologic risk priority tiers.
# All actions are operational guidance only; they are not official dispatch orders.
# ==============================================================================

actions:
  critical:
    - title: "Emergency Silt Clearance & Outflow Desiltation"
      action: "Check outlets and clear silt immediately to restore gravitational conveyance."
      agency: "Minor Irrigation & Ground Water Development Department (MIGWDD) / BBMP Stormwater Wing"
      reason: "Modeled waterlogging risk exceeds 75 with high confidence; immediate drainage impairment risk."
      expected_benefit: "Can restore outlet conveyance where silt is restricting drainage; site inspection is required to confirm."
    - title: "High-Capacity Mobile Pump Deployment"
      action: "Position and stage diesel de-watering pumps at primary low-lying agricultural culverts."
      agency: "Karnataka State Disaster Management Authority (KSDMA) Quick Response Units"
      reason: "Inundation depth modeled to exceed critical crop root zone immersion tolerance."
      expected_benefit: "May shorten standing-water duration where gravity drainage is insufficient; deployment requires on-site verification."

  high:
    - title: "Field Bund & Spillway Inspection"
      action: "Inspect field bunds, check secondary drainage trenches, and clear vegetative blockages."
      agency: "Department of Agriculture / Watershed Development Department (WDD)"
      reason: "Moderate-to-high saturation with high topographic wetness convergence."
      expected_benefit: "May reduce overflow or blockage risk at field drainage points; outcome depends on site conditions."
    - title: "Canal Sluice Gate Throttling"
      action: "Coordinate with Command Area Development Authority (CADA) to regulate intake canals."
      agency: "CADA / Water Resources Department (WRD Karnataka)"
      reason: "High rainfall forecast combined with near-capacity soil water deficit."
      expected_benefit: "May reduce excess canal inflow when appropriate; requires coordination with the authorized water operator."

  routine:
    - title: "Culvert & Road Crossing Inspection"
      action: "Perform routine surveillance of roadside catch basins, culverts, and farm drain exits."
      agency: "Public Works Department (PWD) / Gram Panchayat Engineering Cell"
      reason: "Moderate waterlogging potential under steady rainfall."
      expected_benefit: "May identify obstructed crossings before localized ponding worsens."
    - title: "Soil Moisture & Drainage Trench Monitoring"
      action: "Advise farmers to monitor standing water depth and open furrow furrows if ponding occurs."
      agency: "Raitha Samparka Kendras (RSK) / Dept of Agriculture"
      reason: "Standard seasonal moisture accumulation within tolerable crop thresholds."
      expected_benefit: "Supports timely field response to ponding; benefit depends on local observation and conditions."

  monitor:
    - title: "Telemetry Surveillance & Passive Drainage Monitoring"
      action: "Monitor water levels and local automatic rain gauges; no civil intervention required."
      agency: "Karnataka State Natural Disaster Monitoring Centre (KSNDMC) / Gram Panchayat"
      reason: "Low waterlogging risk or confidence below operational action threshold (confidence < 0.60)."
      expected_benefit: "Supports situational awareness; monitoring alone does not change physical drainage capacity."
